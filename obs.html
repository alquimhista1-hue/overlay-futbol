<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay OBS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5.0.0/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/anton@5.0.0/index.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  font-family: 'Inter', sans-serif;
  background: transparent;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.obs-container {
  width: 1280px;
  height: 720px;
  position: relative;
  transform-origin: top left;
  background: transparent;
}

/* LOGO */
.bg-logo {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 1;
  pointer-events: none;
  user-select: none;
  opacity: 1;
  image-rendering: auto;
}

/* MARCADOR + CRONÓMETROS */
.score-area {
  position: absolute;
  top: 50px;
  left: 50px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

/* MARCADOR */
.scorebug {
  position: relative;
  background: #000000;
  padding: 0 0 0 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 1;
  transform: translateX(0);
  transition: opacity 0.4s ease-out, transform 0.4s ease-out;
}

.scorebug.hidden {
  opacity: 0;
  transform: translateX(-50px);
  pointer-events: none;
}

.team-section {
  display: flex;
  align-items: center;
  gap: 8px;
}

.team-name {
  color: #ffffff;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0 8px;
  min-width: 140px;
  text-align: center;
}

.score-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  color: #ffffff;
  line-height: 1;
  min-width: 35px;
  text-align: center;
  padding: 0 8px;
  font-weight: 900;
}

.separator {
  width: 2px;
  height: 28px;
  background: #ffffff;
  margin: 0 6px;
  opacity: 0.6;
}

/* CONTENEDOR CRONÓMETROS */
.timer-container {
  position: relative;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: auto;
  min-width: 180px;
  margin-top: 0;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.4s ease-out, transform 0.4s ease-out;
}

.timer-container.hidden {
  opacity: 0;
  transform: translateY(-20px);
  pointer-events: none;
}

/* CRONÓMETRO PRINCIPAL */
.main-timer {
  font-family: 'Anton', sans-serif;
  font-size: 46px;
  color: #ffffff;
  background: #000000;
  padding: 2px 10px;
  line-height: 1;
  letter-spacing: 1px;
  text-align: center;
  font-weight: 900;
  min-width: 180px;
}

/* TIEMPO EXTRA - DEBAJO DEL CRONÓMETRO */
.extra-timer-bar {
  background: #FFD700;
  padding: 3px 8px;
  font-family: 'Anton', sans-serif;
  font-size: 18px;
  color: #000000;
  letter-spacing: 1px;
  text-align: center;
  font-weight: 900;
  line-height: 1;
  min-width: 180px;

  display: none;
  opacity: 0;
  transform: translateY(-5px);
}

.extra-timer-bar.active {
  display: block;
  opacity: 1;
  transform: translateY(0);
  animation: showExtraTimer 0.25s ease-out;
}

@keyframes showExtraTimer {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.extra-timer-bar .extra-label {
  margin-right: 6px;
}

.extra-timer-bar .extra-separator {
  margin: 0 6px;
}

/* VIDEO PATROCINADORES */
.sponsor-video-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 5;
  display: none;
  background: transparent;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 30px;
}

.sponsor-video-container.active {
  display: flex;
}

.sponsor-video-container video {
  width: 600px;
  height: auto;
  max-width: 90%;
  object-fit: contain;
}
</style>
</head>

<body>

<div class="obs-container" id="obsContainer">

  <img
    src="logo.png"
    alt=""
    class="bg-logo"
    draggable="false"
    decoding="async"
  >

  <div class="score-area">

    <!-- MARCADOR -->
    <div class="scorebug" id="scorebug">

      <div class="team-section">
        <div class="team-name" id="nameHome">LOC</div>
        <div class="score-num" id="scoreHome">0</div>
      </div>

      <div class="separator"></div>

      <div class="team-section">
        <div class="score-num" id="scoreAway">0</div>
        <div class="team-name" id="nameAway">VIS</div>
      </div>

    </div>

    <!-- CRONÓMETROS -->
    <div class="timer-container" id="timerContainer">

      <!-- CRONÓMETRO PRINCIPAL -->
      <div class="main-timer" id="timerDisplay">
        00:00
      </div>

      <!-- TIEMPO EXTRA DEBAJO -->
      <div class="extra-timer-bar" id="extraTimerBar">
        <span class="extra-label">EXTRA</span>
        <span class="extra-separator">|</span>
        <span id="extraTimerDisplay">00:00</span>
      </div>

    </div>

  </div>

  <!-- VIDEO PATROCINADORES -->
  <div class="sponsor-video-container" id="sponsorVideoContainer">
    <video id="sponsorVideo" muted playsinline>
      <source src="patrocinadores.mp4" type="video/mp4">
    </video>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://xwhtvfcsbvwyymenqmva.supabase.co';

const SUPABASE_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3aHR2ZmNzYnZ3eXltZW5xbXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjc1MjUsImV4cCI6MjEwMjk0MzUyNX0.NDqptVkHHmTasYeO6tN91GIh5_cNGAaYyBIfRps_fR4';

const sbClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let state = {
  nameHome: 'LOC',
  nameAway: 'VIS',
  scoreHome: 0,
  scoreAway: 0,
  timerSeconds: 0,
  isRunning: false,
  sessionStart: 0,
  visible: true
};

let extraActive = false;
let extraTimerSeconds = 0;
let extraInterval = null;

const MAIN_TIME_LIMIT = 45 * 60;
const SPONSOR_INTERVAL_MS = 10 * 60 * 1000;

const sponsorVideo =
  document.getElementById('sponsorVideo');

const sponsorContainer =
  document.getElementById('sponsorVideoContainer');

let sponsorInterval = null;


/* ==========================
   PATROCINADORES
========================== */

function showSponsorVideo() {

  sponsorContainer.classList.add('active');

  sponsorVideo.currentTime = 0;

  sponsorVideo
    .play()
    .catch(e =>
      console.log('⚠️ Error video:', e)
    );
}

sponsorVideo.addEventListener(
  'ended',
  () => {

    sponsorContainer.classList.remove('active');

    sponsorVideo.pause();
  }
);

function startSponsorCycle() {

  showSponsorVideo();

  sponsorInterval = setInterval(
    () => {
      showSponsorVideo();
    },
    SPONSOR_INTERVAL_MS
  );
}


/* ==========================
   FORMATO DE TIEMPO
========================== */

function formatTime(s) {

  const m = Math.floor(s / 60);

  const sec = s % 60;

  return (
    String(m).padStart(2, '0') +
    ':' +
    String(sec).padStart(2, '0')
  );
}


/* ==========================
   ACTUALIZAR INTERFAZ
========================== */

function updateUI() {

  document.getElementById(
    'nameHome'
  ).textContent = state.nameHome;

  document.getElementById(
    'nameAway'
  ).textContent = state.nameAway;

  document.getElementById(
    'scoreHome'
  ).textContent = state.scoreHome;

  document.getElementById(
    'scoreAway'
  ).textContent = state.scoreAway;

  document.getElementById(
    'timerDisplay'
  ).textContent = formatTime(
    state.timerSeconds
  );

  const scorebug =
    document.getElementById('scorebug');

  const timerContainer =
    document.getElementById(
      'timerContainer'
    );

  if (state.visible) {

    scorebug.classList.remove(
      'hidden'
    );

    timerContainer.classList.remove(
      'hidden'
    );

  } else {

    scorebug.classList.add(
      'hidden'
    );

    timerContainer.classList.add(
      'hidden'
    );
  }
}


/* ==========================
   TIEMPO EXTRA
========================== */

function startExtraTimer() {

  if (extraActive) return;

  extraActive = true;

  extraTimerSeconds = 0;

  document.getElementById(
    'extraTimerDisplay'
  ).textContent =
    formatTime(extraTimerSeconds);

  const extraBar =
    document.getElementById(
      'extraTimerBar'
    );

  extraBar.classList.add(
    'active'
  );

  extraInterval = setInterval(
    () => {

      extraTimerSeconds++;

      document.getElementById(
        'extraTimerDisplay'
      ).textContent =
        formatTime(
          extraTimerSeconds
        );

    },
    1000
  );
}


function resetExtraTimer() {

  if (extraInterval) {

    clearInterval(
      extraInterval
    );

    extraInterval = null;
  }

  extraActive = false;

  extraTimerSeconds = 0;

  const extraBar =
    document.getElementById(
      'extraTimerBar'
    );

  extraBar.classList.remove(
    'active'
  );

  document.getElementById(
    'extraTimerDisplay'
  ).textContent = '00:00';
}


/* ==========================
   CRONÓMETRO PRINCIPAL
========================== */

function startTimerLocal() {

  state.sessionStart =
    Date.now() -
    (
      state.timerSeconds *
      1000
    );

  const interval =
    setInterval(
      () => {

        state.timerSeconds =
          Math.floor(
            (
              Date.now() -
              state.sessionStart
            ) /
            1000
          );

        if (
          state.timerSeconds >=
          MAIN_TIME_LIMIT
        ) {

          state.timerSeconds =
            MAIN_TIME_LIMIT;

          startExtraTimer();
        }

        document.getElementById(
          'timerDisplay'
        ).textContent =
          formatTime(
            state.timerSeconds
          );

      },
      1000
    );

  return interval;
}


let mainInterval = null;


/* ==========================
   ACTUALIZACIÓN CENTRAL
========================== */

function applyData(
  d,
  fromPolling = false
) {

  state.nameHome =
    d.name_home;

  state.nameAway =
    d.name_away;

  state.scoreHome =
    d.score_home;

  state.scoreAway =
    d.score_away;

  state.visible =
    d.visible !== false;


  if (fromPolling) {

    if (
      !d.is_running &&
      d.timer_seconds !==
      state.timerSeconds
    ) {

      console.log(
        '🔄 Polling: Detectado Reset o cambio manual'
      );

      state.timerSeconds =
        d.timer_seconds;

      state.isRunning =
        false;

      state.sessionStart =
        d.session_start;

      resetExtraTimer();

      if (mainInterval) {

        clearInterval(
          mainInterval
        );

        mainInterval =
          null;
      }
    }

  } else {

    const wasRunning =
      state.isRunning;

    state.timerSeconds =
      d.timer_seconds;

    state.isRunning =
      d.is_running;

    state.sessionStart =
      d.session_start;


    if (
      wasRunning &&
      !state.isRunning
    ) {

      console.log(
        '⏸️ Cronómetro pausado - Deteniendo tiempo extra'
      );

      resetExtraTimer();
    }


    if (
      state.timerSeconds <
      MAIN_TIME_LIMIT
    ) {

      resetExtraTimer();
    }


    if (state.isRunning) {

      if (mainInterval) {

        clearInterval(
          mainInterval
        );
      }

      mainInterval =
        startTimerLocal();


      if (
        state.timerSeconds >=
        MAIN_TIME_LIMIT &&
        !extraActive
      ) {

        console.log(
          '▶️ Reanudando tiempo extra'
        );

        startExtraTimer();
      }

    } else {

      if (mainInterval) {

        clearInterval(
          mainInterval
        );

        mainInterval =
          null;
      }
    }
  }

  updateUI();
}


/* ==========================
   CARGA INICIAL
========================== */

async function loadFromSupabase() {

  try {

    const {
      data,
      error
    } =
      await sbClient
        .from('overlay_state')
        .select('*')
        .eq('id', 1)
        .single();

    if (error) {

      console.error(
        'Error:',
        error.message
      );

      return;
    }

    applyData(data);

  } catch (e) {

    console.error(
      '❌ Excepción:',
      e
    );
  }
}

loadFromSupabase();


/* ==========================
   SUPABASE REALTIME
========================== */

sbClient
  .channel('overlay_changes')
  .on(
    'postgres_changes',

    {
      event: '*',
      schema: 'public',
      table: 'overlay_state',
      filter: 'id=eq.1'
    },

    payload => {

      applyData(
        payload.new,
        false
      );
    }
  )

  .subscribe(
    status => {

      if (
        status ===
        'SUBSCRIBED'
      ) {

        console.log(
          '✅ Tiempo real activo'
        );
      }
    }
  );


/* ==========================
   POLLING DE RESPALDO
========================== */

setInterval(
  async () => {

    try {

      const {
        data,
        error
      } =
        await sbClient
          .from('overlay_state')
          .select('*')
          .eq('id', 1)
          .single();

      if (error) return;

      let needsSync =
        false;


      if (
        data.name_home !==
          state.nameHome ||

        data.name_away !==
          state.nameAway ||

        data.score_home !==
          state.scoreHome ||

        data.score_away !==
          state.scoreAway ||

        data.visible !==
          state.visible
      ) {

        needsSync =
          true;
      }


      if (
        !data.is_running &&
        data.timer_seconds !==
          state.timerSeconds
      ) {

        needsSync =
          true;
      }


      if (needsSync) {

        applyData(
          data,
          true
        );
      }

    } catch (e) {

      console.warn(
        '⚠️ Excepción en polling:',
        e
      );
    }

  },
  5000
);


/* ==========================
   INICIAR PATROCINADORES
========================== */

startSponsorCycle();


/* ==========================
   ESCALADO RESPONSIVE
========================== */

function scaleToFit() {

  const container =
    document.getElementById(
      'obsContainer'
    );

  const scaleX =
    window.innerWidth /
    1280;

  const scaleY =
    window.innerHeight /
    720;

  const scale =
    Math.min(
      scaleX,
      scaleY
    );

  const offsetX =
    (
      window.innerWidth -
      1280 * scale
    ) /
    2;

  const offsetY =
    (
      window.innerHeight -
      720 * scale
    ) /
    2;

  container.style.transform =
    `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

  container.style.transformOrigin =
    'top left';
}

window.addEventListener(
  'resize',
  scaleToFit
);

window.addEventListener(
  'load',
  scaleToFit
);

scaleToFit();
</script>

</body>
</html>

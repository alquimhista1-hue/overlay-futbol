<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay OBS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5.0.0/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/anton@5.0.0/index.min.css" />
  <style>
    /* Reset y base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .obs-container {
      width: 1280px;
      height: 720px;
      position: relative;
      transform-origin: top left;
    }

    /* ===== LOGO DE FONDO ===== */
    .bg-logo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      pointer-events: none;
      user-select: none;
      opacity: 1;
    }

    /* ===== MARCADOR (arriba izquierda) ===== */
    .scorebug {
      position: absolute;
      top: 50px;
      left: 50px;
      background: #000000;
      border: none;
      border-radius: 0;
      padding: 0 10px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      overflow: hidden;
    }

    .scorebug.hidden {
      display: none;
    }

    .team-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-name {
      background: transparent;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0 4px;
      min-width: 44px;
      text-align: center;
    }

    .score-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 23px;
      color: #ffffff;
      line-height: 1;
      min-width: 21px;
      text-align: center;
      padding: 0 4px;
      font-weight: 900;
    }

    .separator {
      width: 1px;
      height: 20px;
      background: #ffffff;
      margin: 0 4px;
      opacity: 0.6;
    }

    /* ===== CRONÓMETRO (abajo, centrado, grande) ===== */
    #timerContainer {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      pointer-events: none;
      /* para que no interfiera con clics */;
    }

    #mainTimerDisplay {
      font-family: 'Anton', sans-serif;
      font-size: 80px;
      color: #ffffff;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
      line-height: 1;
      letter-spacing: 2px;
    }

    #extraTimerDisplay {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      color: #f59e0b;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
      line-height: 1;
      display: none;
      letter-spacing: 1px;
    }

    #extraTimerDisplay.active {
      display: block;
    }

    /* ===== VIDEO DEL PATROCINADOR ===== */
    .sponsor-video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: none;
      background: transparent;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 30px;
    }

    .sponsor-video-container.active {
      display: flex;
    }

    .sponsor-video-container video {
      width: 600px;
      height: auto;
      max-width: 90%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="obs-container" id="obsContainer">

    <!-- LOGO DE FONDO -->
    <img src="logo.png" alt="" class="bg-logo" draggable="false" decoding="async" />

    <!-- MARCADOR (solo nombres y puntuaciones) -->
    <div class="scorebug" id="scorebug">
      <div class="team-section">
        <div class="team-name" id="nameHome">LOC</div>
        <div class="score-num" id="scoreHome">0</div>
      </div>

      <div class="separator"></div>

      <div class="team-section">
        <div class="score-num" id="scoreAway">0</div>
        <div class="team-name" id="nameAway">VIS</div>
      </div>
    </div>

    <!-- CRONÓMETRO (nuevo, abajo) -->
    <div id="timerContainer">
      <div id="mainTimerDisplay">00:00</div>
      <div id="extraTimerDisplay">00:00</div>
    </div>

    <!-- VIDEO PATROCINADOR -->
    <div class="sponsor-video-container" id="sponsorVideoContainer">
      <video id="sponsorVideo" muted playsinline>
        <source src="patrocinadores.mp4" type="video/mp4" />
      </video>
    </div>
  </div>

  <script>
    // ===== SUPABASE =====
    const SUPABASE_URL = 'https://ccjggxrjmuahaaoujspu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjamdneHJqbXVhaGFhb3Vqc3B1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MzQwNjksImV4cCI6MjEwMTIxMDA2OX0.vWVJ2gpgw8-jvu714R1x8rNPQbzQpjKA4RTXmVwPlks';

    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ===== ESTADO =====
    let state = {
      nameHome: 'LOC',
      nameAway: 'VIS',
      scoreHome: 0,
      scoreAway: 0,
      timerSeconds: 0,
      isRunning: false,
      sessionStart: 0,
      visible: true
    };

    let extraActive = false;
    let extraTimerSeconds = 0;
    let extraInterval = null;
    const MAIN_TIME_LIMIT = 45 * 60;

    // ===== ELEMENTOS DOM =====
    const mainTimerDisplay = document.getElementById('mainTimerDisplay');
    const extraTimerDisplay = document.getElementById('extraTimerDisplay');
    const scorebug = document.getElementById('scorebug');
    const nameHomeEl = document.getElementById('nameHome');
    const nameAwayEl = document.getElementById('nameAway');
    const scoreHomeEl = document.getElementById('scoreHome');
    const scoreAwayEl = document.getElementById('scoreAway');

    const sponsorVideo = document.getElementById('sponsorVideo');
    const sponsorContainer = document.getElementById('sponsorVideoContainer');
    let sponsorInterval = null;

    // ===== FUNCIONES DEL CRONÓMETRO =====
    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function updateUI() {
      nameHomeEl.textContent = state.nameHome;
      nameAwayEl.textContent = state.nameAway;
      scoreHomeEl.textContent = state.scoreHome;
      scoreAwayEl.textContent = state.scoreAway;
      mainTimerDisplay.textContent = formatTime(state.timerSeconds);

      // Visibilidad del marcador
      if (state.visible) {
        scorebug.classList.remove('hidden');
      } else {
        scorebug.classList.add('hidden');
      }
    }

    function startExtraTimer() {
      if (extraActive) return;
      extraActive = true;
      extraTimerSeconds = 0;
      extraTimerDisplay.classList.add('active');
      extraTimerDisplay.textContent = formatTime(0);

      if (extraInterval) clearInterval(extraInterval);
      extraInterval = setInterval(() => {
        extraTimerSeconds++;
        extraTimerDisplay.textContent = formatTime(extraTimerSeconds);
      }, 1000);
    }

    function resetExtraTimer() {
      extraActive = false;
      extraTimerSeconds = 0;
      if (extraInterval) {
        clearInterval(extraInterval);
        extraInterval = null;
      }
      extraTimerDisplay.classList.remove('active');
      extraTimerDisplay.textContent = '00:00';
    }

    function startTimerLocal() {
      state.sessionStart = Date.now() - (state.timerSeconds * 1000);
      const interval = setInterval(() => {
        state.timerSeconds = Math.floor((Date.now() - state.sessionStart) / 1000);

        if (state.timerSeconds >= MAIN_TIME_LIMIT) {
          state.timerSeconds = MAIN_TIME_LIMIT;
          startExtraTimer();
        }

        mainTimerDisplay.textContent = formatTime(state.timerSeconds);
      }, 1000);
      return interval;
    }

    let mainInterval = null;

    // ===== CARGA INICIAL DESDE SUPABASE =====
    async function loadFromSupabase() {
      console.log('Cargando estado desde Supabase...');
      try {
        const { data, error } = await sbClient
          .from('overlay_state')
          .select('*')
          .eq('id', 1)
          .single();

        if (error) {
          console.error('Error al cargar:', error);
          return;
        }

        state.nameHome = data.name_home || 'LOC';
        state.nameAway = data.name_away || 'VIS';
        state.scoreHome = data.score_home || 0;
        state.scoreAway = data.score_away || 0;
        state.timerSeconds = data.timer_seconds || 0;
        state.isRunning = data.is_running || false;
        state.sessionStart = data.session_start || 0;
        state.visible = data.visible !== false;

        if (state.isRunning) {
          mainInterval = startTimerLocal();
        }

        if (state.timerSeconds >= MAIN_TIME_LIMIT) {
          startExtraTimer();
        }

        updateUI();
      } catch (e) {
        console.error('Error:', e);
      }
    }

    loadFromSupabase();

    // ===== SUSCRIPCIÓN A CAMBIOS EN SUPABASE =====
    sbClient
      .channel('overlay_obs')
      .on(
        'postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'overlay_state',
          filter: 'id=eq.1'
        },
        (payload) => {
          const d = payload.new;

          state.nameHome = d.name_home;
          state.nameAway = d.name_away;
          state.scoreHome = d.score_home;
          state.scoreAway = d.score_away;
          state.timerSeconds = d.timer_seconds;
          state.isRunning = d.is_running;
          state.sessionStart = d.session_start;
          state.visible = d.visible !== false;

          if (state.timerSeconds < MAIN_TIME_LIMIT) {
            resetExtraTimer();
          }

          if (state.isRunning) {
            if (mainInterval) clearInterval(mainInterval);
            mainInterval = startTimerLocal();
          } else {
            if (mainInterval) {
              clearInterval(mainInterval);
              mainInterval = null;
            }
          }

          updateUI();
        }
      )
      .subscribe();

    // ===== CICLO DEL PATROCINADOR (cada 10 min) =====
    function showSponsorVideo() {
      sponsorContainer.classList.add('active');
      sponsorVideo.currentTime = 0;
      sponsorVideo.play().catch(e => console.log('Error al reproducir:', e));
    }

    sponsorVideo.addEventListener('ended', () => {
      sponsorContainer.classList.remove('active');
      sponsorVideo.pause();
    });

    function startSponsorCycle() {
      showSponsorVideo();
      const SPONSOR_INTERVAL_MS = 10 * 60 * 1000;
      sponsorInterval = setInterval(() => {
        showSponsorVideo();
      }, SPONSOR_INTERVAL_MS);
    }

    startSponsorCycle();

    // ===== ESCALADO RESPONSIVE =====
    function scaleToFit() {
      const container = document.getElementById('obsContainer');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const designWidth = 1280;
      const designHeight = 720;

      const scaleX = windowWidth / designWidth;
      const scaleY = windowHeight / designHeight;
      const scale = Math.min(scaleX, scaleY);

      const offsetX = (windowWidth - designWidth * scale) / 2;
      const offsetY = (windowHeight - designHeight * scale) / 2;

      container.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
      container.style.transformOrigin = 'top left';
    }

    window.addEventListener('resize', scaleToFit);
    window.addEventListener('load', scaleToFit);
    scaleToFit();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay OBS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5.0.0/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/anton@5.0.0/index.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    font-family: 'Inter', sans-serif; 
    background: transparent; 
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  
  .obs-container {
    width: 1280px;
    height: 720px;
    position: relative;
    transform-origin: top left;
    background: #87CEEB; /* Celeste de prueba */
  }
  
  .bg-logo {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
    user-select: none;
    opacity: 0.3;
  }
  
  /*  MARCADOR */
  .scorebug { 
    position: absolute; 
    top: 50px; left: 50px; 
    background: #000000;
    padding: 0 0 0 15px;
    display: flex; 
    align-items: center; 
    gap: 10px;
    z-index: 10;
  }
  
  .scorebug.hidden { display: none; }
  
  .team-section { display: flex; align-items: center; gap: 8px; }
  
  .team-name { 
    color: #ffffff; 
    font-size: 20px;
    font-weight: 900; 
    letter-spacing: 1px;
    text-transform: uppercase; 
    padding: 0 8px;
    min-width: 140px;
    text-align: center;
  }
  
  .score-num { 
    font-family: 'Bebas Neue', sans-serif; 
    font-size: 32px;
    color: #ffffff; 
    line-height: 1; 
    min-width: 35px;
    text-align: center;
    padding: 0 8px;
    font-weight: 900;
  }
  
  .separator { width: 2px; height: 28px; background: #ffffff; margin: 0 6px; opacity: 0.6; }

  /* ⏱️ CRONÓMETRO COMPACTO - NÚMEROS GRANDES QUE OCUPAN TODO EL FONDO */
  .timer-container {
    position: absolute;
    bottom: 50px;
    left: 50px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .main-timer {
    font-family: 'Anton', sans-serif;
    font-size: 64px; /* Números bien grandes */
    color: #ffffff;
    background: #000000;
    padding: 4px 12px; /* Padding mínimo - compacto */
    line-height: 1;
    letter-spacing: 2px;
    display: inline-block;
    /* Estirar verticalmente para que se vean más altos */
    transform: scaleY(1.25);
    transform-origin: center center;
  }
  
  .extra-timer {
    font-family: 'Anton', sans-serif;
    font-size: 64px;
    color: #f59e0b;
    background: #000000;
    padding: 4px 12px;
    line-height: 1;
    letter-spacing: 2px;
    display: none;
    transform: scaleY(1.25);
    transform-origin: center center;
  }
  
  .extra-timer.active { display: inline-block; }

  .sponsor-video-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
    display: none; background: transparent; justify-content: center; align-items: flex-end; padding-bottom: 30px;
  }
  
  .sponsor-video-container.active { display: flex; }
  
  .sponsor-video-container video { width: 600px; height: auto; max-width: 90%; object-fit: contain; }
</style>
</head>
<body>
  <div class="obs-container" id="obsContainer">
    <img src="logo.png" alt="" class="bg-logo" draggable="false" decoding="async">
    
    <div class="scorebug" id="scorebug">
      <div class="team-section">
        <div class="team-name" id="nameHome">LOC</div>
        <div class="score-num" id="scoreHome">0</div>
      </div>
      <div class="separator"></div>
      <div class="team-section">
        <div class="score-num" id="scoreAway">0</div>
        <div class="team-name" id="nameAway">VIS</div>
      </div>
    </div>

    <div class="timer-container">
      <div class="main-timer" id="timerDisplay">00:00</div>
      <div class="extra-timer" id="extraTimerDisplay">00:00</div>
    </div>

    <div class="sponsor-video-container" id="sponsorVideoContainer">
      <video id="sponsorVideo" muted playsinline>
        <source src="patrocinadores.mp4" type="video/mp4">
      </video>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://xwhtvfcsbvwyymenqmva.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3aHR2ZmNzYnZ3eXltZW5xbXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjc1MjUsImV4cCI6MjEwMjk0MzUyNX0.NDqptVkHHmTasYeO6tN91GIh5_cNGAaYyBIfRps_fR4';
  
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let state = { 
    nameHome: 'LOC', nameAway: 'VIS', scoreHome: 0, scoreAway: 0, 
    timerSeconds: 0, isRunning: false, sessionStart: 0, visible: true
  };
  
  let extraActive = false;
  let extraTimerSeconds = 0;
  let extraInterval = null;
  const MAIN_TIME_LIMIT = 45 * 60;
  const SPONSOR_INTERVAL_MS = 10 * 60 * 1000;
  
  const sponsorVideo = document.getElementById('sponsorVideo');
  const sponsorContainer = document.getElementById('sponsorVideoContainer');
  let sponsorInterval = null;

  function showSponsorVideo() {
    sponsorContainer.classList.add('active');
    sponsorVideo.currentTime = 0;
    sponsorVideo.play().catch(e => console.log('⚠️ Error video:', e));
  }

  sponsorVideo.addEventListener('ended', () => {
    sponsorContainer.classList.remove('active');
    sponsorVideo.pause();
  });

  function startSponsorCycle() {
    showSponsorVideo();
    sponsorInterval = setInterval(() => { showSponsorVideo(); }, SPONSOR_INTERVAL_MS);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function updateUI() {
    document.getElementById('nameHome').textContent = state.nameHome;
    document.getElementById('nameAway').textContent = state.nameAway;
    document.getElementById('scoreHome').textContent = state.scoreHome;
    document.getElementById('scoreAway').textContent = state.scoreAway;
    document.getElementById('timerDisplay').textContent = formatTime(state.timerSeconds);
    
    const scorebug = document.getElementById('scorebug');
    if (state.visible) scorebug.classList.remove('hidden');
    else scorebug.classList.add('hidden');
  }

  function startExtraTimer() {
    if (extraActive) return;
    extraActive = true;
    extraTimerSeconds = 0;
    document.getElementById('extraTimerDisplay').classList.add('active');
    
    extraInterval = setInterval(() => {
      extraTimerSeconds++;
      document.getElementById('extraTimerDisplay').textContent = formatTime(extraTimerSeconds);
    }, 1000);
  }

  function resetExtraTimer() {
    extraActive = false;
    extraTimerSeconds = 0;
    if (extraInterval) clearInterval(extraInterval);
    document.getElementById('extraTimerDisplay').classList.remove('active');
    document.getElementById('extraTimerDisplay').textContent = '00:00';
  }

  function startTimerLocal() {
    state.sessionStart = Date.now() - (state.timerSeconds * 1000);
    const interval = setInterval(() => {
      state.timerSeconds = Math.floor((Date.now() - state.sessionStart) / 1000);
      if (state.timerSeconds >= MAIN_TIME_LIMIT) {
        state.timerSeconds = MAIN_TIME_LIMIT;
        startExtraTimer();
      }
      document.getElementById('timerDisplay').textContent = formatTime(state.timerSeconds);
    }, 1000);
    return interval;
  }

  let mainInterval = null;

  async function loadFromSupabase() {
    console.log('🔄 Cargando desde Supabase...');
    try {
      const { data, error } = await sbClient.from('overlay_state').select('*').eq('id', 1).single();
      
      if (error) { 
        console.error('❌ Error:', error.message); 
        return; 
      }
      
      console.log('✅ Datos recibidos:', data);
      
      state.nameHome = data.name_home || 'LOC';
      state.nameAway = data.name_away || 'VIS';
      state.scoreHome = data.score_home || 0;
      state.scoreAway = data.score_away || 0;
      state.timerSeconds = data.timer_seconds || 0;
      state.isRunning = data.is_running || false;
      state.sessionStart = data.session_start || 0;
      state.visible = data.visible !== false;

      if (state.isRunning) {
        mainInterval = startTimerLocal();
      }

      if (state.timerSeconds >= MAIN_TIME_LIMIT) {
        startExtraTimer();
      }
      
      updateUI();
    } catch (e) { 
      console.error('❌ Excepción:', e); 
    }
  }

  loadFromSupabase();

  // ===== 🔔 SUSCRIPCIÓN EN TIEMPO REAL (CANAL UNIFICADO) =====
  console.log('📡 Suscribiendo al canal "overlay_changes"...');
  
  const channel = sbClient.channel('overlay_changes');
  
  channel
    .on('postgres_changes', 
      { 
        event: '*', 
        schema: 'public', 
        table: 'overlay_state', 
        filter: 'id=eq.1' 
      },
      (payload) => {
        console.log(' CAMBIO RECIBIDO:', payload);
        
        const d = payload.new;
        
        state.nameHome = d.name_home; 
        state.nameAway = d.name_away;
        state.scoreHome = d.score_home; 
        state.scoreAway = d.score_away;
        state.timerSeconds = d.timer_seconds; 
        state.isRunning = d.is_running; 
        state.sessionStart = d.session_start;
        state.visible = d.visible !== false;
        
        if (state.timerSeconds < MAIN_TIME_LIMIT) {
          resetExtraTimer();
        }
        
        if (state.isRunning) {
          if (mainInterval) clearInterval(mainInterval);
          mainInterval = startTimerLocal();
        } else {
          if (mainInterval) {
            clearInterval(mainInterval);
            mainInterval = null;
          }
        }
        
        updateUI();
        console.log('✅ UI actualizada');
      }
    )
    .subscribe((status) => {
      console.log('🔌 Estado:', status);
      if (status === 'SUBSCRIBED') {
        console.log('✅ ✅ ✅ TIEMPO REAL ACTIVO ✅ ✅ ✅');
      } else if (status === 'CHANNEL_ERROR') {
        console.error('❌ ERROR EN CANAL - Ejecuta: ALTER TABLE overlay_state REPLICA IDENTITY FULL;');
      }
    });

  startSponsorCycle();

  function scaleToFit() {
    const container = document.getElementById('obsContainer');
    const scaleX = window.innerWidth / 1280;
    const scaleY = window.innerHeight / 720;
    const scale = Math.min(scaleX, scaleY);
    const offsetX = (window.innerWidth - 1280 * scale) / 2;
    const offsetY = (window.innerHeight - 720 * scale) / 2;
    
    container.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    container.style.transformOrigin = 'top left';
  }

  window.addEventListener('resize', scaleToFit);
  window.addEventListener('load', scaleToFit);
  scaleToFit();
</script>
</body>
</html>

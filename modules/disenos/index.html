<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diseños · CDN Studio</title>
<script src="../../assets/js/module-bridge.js?v=10"></script>
<style>
html{scrollbar-gutter:stable}*{box-sizing:border-box}body{margin:0;padding:12px;background:#f5f7fa;color:#132743;font:15px system-ui,sans-serif}main{max-width:640px;margin:auto}[hidden]{display:none!important}
button,input,textarea{font:inherit}button,.upload{min-height:44px;padding:10px 14px;border:1px solid #d3dce9;border-radius:12px;background:#fff;color:#132743;font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,.upload:focus-within{outline:3px solid #438ed1;outline-offset:2px}button:disabled{opacity:.55;cursor:default}
.tabs,.actions,.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{padding:4px;background:#e5ecf5;border-radius:15px;margin-bottom:12px}.tabs button{border:0;background:transparent}.tabs .active,.primary{background:#051b48;color:white;border-color:#051b48}
section,.photo-card{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:14px}h1,h2{margin:0;font-size:17px}h2{font-size:14px}.hint,.count{color:#576b83;font-size:13px;line-height:1.45}.hint{margin:5px 0 12px}.photo-grid{display:grid;gap:10px;margin:12px 0 16px}.photo-card{padding:11px;background:#f7f9fc}.photo-actions{margin-top:8px}.upload{display:grid;place-items:center;position:relative;text-align:center}.upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.photo-actions button{padding-inline:6px}.crop{display:block;max-width:100%;width:auto;height:auto;max-height:170px;margin:8px auto 0;border-radius:8px;background:#e7edf5}
details{margin-top:8px}summary{padding:11px 0;cursor:pointer;font-weight:650}details label{display:grid;gap:4px;margin:8px 0;font-size:13px}input[type=range]{width:100%;min-height:32px;accent-color:#126bbc}textarea{width:100%;min-height:76px;resize:none;border:1px solid #cdd8e7;border-radius:12px;padding:10px;margin:6px 0;color:inherit;background:white;font-size:16px}.count{display:block;text-align:right;margin-bottom:12px}
#preview{display:block;width:100%;height:auto;background:white;border:1px solid #e1e7ef;border-radius:8px;margin-bottom:12px}#status{min-height:0;margin:8px 0;font-size:13px}#status:empty{display:none}dialog{width:min(92%,400px);border:0;border-radius:16px;padding:18px;color:inherit}dialog::backdrop{background:#051b4899}@media(min-width:560px){.photo-grid{grid-template-columns:1fr 1fr}}

.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 10px;gap:7px}.photo-card{padding:8px;min-width:0}.photo-card h2 small{font-weight:500;font-size:11px}.photo-actions{grid-template-columns:1fr;gap:4px}.photo-actions .upload{padding-inline:5px}.photo-actions .remove{min-height:36px;padding:4px}.count{margin-bottom:7px}
.design-sheet{position:relative;margin-bottom:8px}.design-sheet #preview{margin:0;border:0}#touchArea{position:absolute;inset:0 0 auto;height:62.5%;touch-action:none;cursor:grab;z-index:1}#touchArea:active{cursor:grabbing}
@media(max-width:559px){body{padding:6px}section{padding:9px}.tabs{margin-bottom:7px}.tabs button{padding-inline:5px}.photo-card h2{font-size:13px}#config .upload{font-size:13px}}
@font-face{font-family:"Oswald";src:url("./fuentes/oswald.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Fira Sans Condensed";src:url("./fuentes/firasanscondensed.woff2") format("woff2");font-weight:700;font-display:swap}
.font-picks{display:flex;align-items:center;gap:4px;margin:0 0 8px;flex-wrap:wrap}.font-picks span{font-size:12px;margin-right:4px}.font-picks button{min-height:44px;min-width:44px;padding:4px;border-radius:8px}.font-picks [aria-pressed=true]{background:#051b48;color:white;border-color:#051b48}
.design-toolbar{display:flex;align-items:center;gap:var(--spacing-2);flex-wrap:wrap;margin-bottom:var(--spacing-2)}
.design-toolbar p{margin:0;margin-right:auto}.design-toolbar small,.preview-tip{display:block;color:var(--color-text-primary);opacity:.72}.design-toolbar button{border-radius:var(--radius-element)}#config,#previewPanel{min-width:0}
main{display:grid;gap:var(--spacing-2);align-items:start;max-width:60rem}.design-toolbar,#status{grid-column:1/-1}
.headline-options,.preview-heading{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-2)}.headline-options label{font-size:.8125rem}.headline-options .count{margin:0}.preview-heading{margin-bottom:var(--spacing-2)}.preview-tip{margin-top:var(--spacing-2)}
.font-picks,.photo-grid{border:0;padding:0;margin:var(--spacing-3) 0 0}.design-sheet{margin:0 auto;max-width:27rem}
@media(min-width:42rem){main{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}}
@media(max-width:24rem){.design-toolbar p{flex-basis:100%}}

#config details{border:1px solid var(--color-border);border-radius:var(--radius-element);padding:0 var(--spacing-2) var(--spacing-2)}
#config details summary{padding:var(--spacing-2) 0}
#config details:not([open]){padding-bottom:0}
.design-toolbar{margin-bottom:0}
@media(min-width:42rem){main{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.design-sheet{max-width:34rem}}
@media(max-width:41.99rem){.design-sheet{max-width:20rem}}

#touchArea{bottom:auto;top:var(--photo-top,0%);height:var(--photo-height,62.5%)}
.template-limit{margin:var(--spacing-2) 0;font-weight:650;color:var(--color-text-primary)}

.design-toolbar{justify-content:flex-end;gap:var(--spacing-2);margin:0}
.template-switch{display:grid;grid-template-columns:3.25rem minmax(0,1fr) 3.25rem;align-items:center;gap:var(--spacing-1);width:min(100%,16.5rem);margin:0 auto var(--spacing-1)}
.template-switch output{text-align:center;font-weight:750}
.template-switch button{min-width:2.75rem;background:#f6ba38;color:#132743;border-color:transparent;font-size:1.25rem;line-height:1}
.template-switch button:hover{background:#ffd47a}.template-switch button:active{background:#e29e21}
#previewPanel #headline{margin:var(--spacing-1) 0;min-height:3.5rem;border-radius:var(--radius-element)}
#previewPanel .headline-options{justify-content:flex-end;margin-bottom:var(--spacing-2)}
#cropToggle{background:#051b48;color:white;border-color:currentColor}
#cropToggle[aria-pressed=true]{background:#f6ba38;color:#132743}
@media(pointer:coarse),(hover:none){.preview-tip{display:none}}
@media(max-width:41.99rem){.design-toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.design-toolbar button{padding-inline:var(--spacing-2)}}

.design-toolbar button{min-height:2.25rem;padding:var(--spacing-1) var(--spacing-2)}
#config,#previewPanel{padding:var(--spacing-2)}
.template-switch button{display:grid;place-items:center;min-height:2rem;padding:0 var(--spacing-2);width:3.25rem}
.template-switch svg{display:block;width:1.625rem;height:1.625rem}
#config #headline{display:block;height:5rem;overflow:hidden;line-height:1.2;margin:0;min-height:3.25rem;padding:var(--spacing-2);border-radius:var(--radius-element)}
.template-limit{font-size:.6875rem;line-height:1.25;font-weight:550;margin:var(--spacing-1) 0 0}
.media-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--spacing-2);width:100%;margin:0 auto;padding:var(--spacing-2);align-items:start}
.media-controls .photo-grid{margin:0;gap:var(--spacing-1)}
.media-controls .photo-card{padding:var(--spacing-1);border-radius:var(--radius-element)}
.photo-actions{margin-top:var(--spacing-1)}
.photo-actions .upload,.photo-actions .remove{min-height:2.125rem;padding:var(--spacing-1);font-size:.8125rem}
.media-controls .font-picks{display:grid;justify-items:center;gap:var(--spacing-1);margin:0}
@media(max-width:41.99rem){.media-controls{max-width:calc(20rem + 2 * var(--spacing-2))}}
.media-controls .font-picks span{margin:0;font-size:.6875rem}
.media-controls .font-picks button{min-width:2.125rem;min-height:2rem}
#cropToggle{position:absolute;z-index:2;inset:auto var(--spacing-2) var(--spacing-2) auto;width:auto;min-height:2rem;margin:0;padding:var(--spacing-1) var(--spacing-2);font-size:.8125rem}
@media(min-width:42rem){
 /* En móvil, los controles van debajo de la imagen. En escritorio, van a la derecha, debajo del titular. */
 main{grid-template-rows:auto max-content 1fr auto}
 #previewPanel{grid-column:1;grid-row:2 / span 2}
 #config{grid-column:2;grid-row:2}
 .media-controls{grid-column:2;grid-row:3}
 .template-switch svg{width:2rem;height:2rem}
 .template-switch button{min-height:2.5rem}
}
.photo-thumbnail{display:block;width:100%;height:4rem;object-fit:cover;border-radius:var(--radius-element);margin-bottom:var(--spacing-1)}
/* Only the circular handle captures touch while the page remains scrollable. */
#circleHandle{position:absolute;z-index:3;transform:translate(-50%,-50%);min-height:0;min-width:0;padding:0;border:0;border-radius:50%;background:transparent;touch-action:none;cursor:move}
#circleHandle:active{transform:translate(-50%,-50%);background:transparent}
#circleHandle:focus-visible{outline:3px solid var(--color-border);outline-offset:3px}
.media-controls{grid-template-columns:minmax(0,1fr)}
#circleOptions{padding:0;border:0;margin:0}
#circleAdjust label{display:block;font-size:.8125rem;margin-top:var(--spacing-2)}
#circleAdjust input{display:block;width:100%}
#splitTextOptions{padding:0;border:0;margin:var(--spacing-1) 0 0}
#splitHelp{font-size:.75rem;line-height:1.4;margin:0 0 var(--spacing-1)}
#config #bottomHeadline{display:block;height:5rem;overflow:hidden;resize:none;line-height:1.2;margin:0;padding:var(--spacing-2)}
@font-face{font-family:"Barlow Condensed";src:url("./fuentes/barlowcondensed-extrabold.ttf") format("truetype");font-weight:800;font-display:swap}
</style>
<link rel="stylesheet" href="../../assets/css/astryx-core.css?v=1"><link rel="stylesheet" href="../../assets/css/astryx-cdn.css?v=25"><link rel="stylesheet" href="../../assets/css/alerts.css?v=26"><script defer src="../../assets/js/alerts.js?v=26"></script></head>
<body><main>
<header class="design-toolbar" aria-label="Acciones del diseño">
  <button type="button" id="newDesign">Nuevo diseño</button>
  <button type="button" class="primary" id="download" disabled>Descargar JPG</button>
</header>
<section id="config" aria-label="Opciones del diseño">
  <nav class="template-switch" aria-label="Plantillas de diseño">
    <button type="button" id="templatePrev" aria-label="Plantilla anterior"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m7-7-7 7 7 7"/></svg></button>
    <output id="templateName" aria-live="polite">Clásica</output>
    <button type="button" id="templateNext" aria-label="Plantilla siguiente"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></button>
  </nav>
  <textarea id="headline" aria-label="Titular" rows="3" maxlength="220" placeholder="Escribe el titular de la noticia" aria-describedby="titleLimit"></textarea>
  <section id="splitTextOptions" hidden>
    <p id="splitHelp">Líneas automáticas de hasta dos palabras. Las líneas alternan blanco y dorado. Puedes usar Enter para separar una frase.</p>
    <textarea id="bottomHeadline" aria-label="Texto inferior" rows="4" maxlength="220" placeholder="CADA MADRE&#10;RECIBIRÁ&#10;AHORA&#10;Q1,000"></textarea>
  </section>
  <p id="titleLimit"  class="template-limit" role="status" hidden></p>
</section>
<section id="previewPanel" aria-label="Vista previa en vivo">
  <figure class="design-sheet"><div id="touchArea" aria-hidden="true" hidden></div><canvas id="preview" width="1200" height="1400" aria-label="Vista previa del diseño vertical"></canvas>
  <button type="button" id="cropToggle" aria-pressed="false" hidden>Encuadrar foto</button>
  <button type="button" id="circleHandle" hidden aria-label="Mover círculo. Arrastra o usa las flechas del teclado." title="Arrastra para mover el círculo"></button>
  </figure>
</section>
  <section class="media-controls" aria-label="Fotografías del diseño">
    <label class="upload">Subir fotos<input id="photoUpload" type="file" accept="image/*" multiple aria-label="Seleccionar una o dos fotos"></label>
    <section class="photo-grid" id="photos" aria-label="Fotografías"></section>
    <section id="circleOptions" hidden>
      <label class="upload">Foto del círculo<input id="circleUpload" type="file" accept="image/*"></label>
      <div id="circleAdjust" hidden>
        <label>Tamaño del círculo<input id="circleSize" type="range" min="220" max="560" value="380"></label>
        <label>Zoom de la foto<input id="circleZoom" type="range" min="100" max="300" value="100"></label>
        <button type="button" id="removeCircle">Quitar círculo</button>
      </div>
    </section>
  </section>
<p id="status" role="status"></p>
<dialog id="resetDialog" aria-labelledby="resetTitle"><h2 id="resetTitle">¿Empezar un nuevo diseño?</h2><p>Se quitarán las fotos y el titular actuales.</p><form method="dialog" class="actions"><button value="cancel">Cancelar</button><button class="primary" value="reset">Nuevo diseño</button></form></dialog>
</main>
<script src="./editor.js?v=47"></script>
</body></html>

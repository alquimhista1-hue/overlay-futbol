<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diseños · CDN Studio</title>
<script src="../../assets/js/module-bridge.js?v=10"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f5f7fa;color:#132743;font:15px system-ui,sans-serif}main{max-width:640px;margin:auto}[hidden]{display:none!important}
button,input,textarea{font:inherit}button,.upload{min-height:44px;padding:10px 14px;border:1px solid #d3dce9;border-radius:12px;background:#fff;color:#132743;font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,.upload:focus-within{outline:3px solid #438ed1;outline-offset:2px}button:disabled{opacity:.55;cursor:default}
.tabs,.actions,.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{padding:4px;background:#e5ecf5;border-radius:15px;margin-bottom:12px}.tabs button{border:0;background:transparent}.tabs .active,.primary{background:#051b48;color:white;border-color:#051b48}
section,.photo-card{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:14px}h1,h2{margin:0;font-size:17px}h2{font-size:14px}.hint,.count{color:#576b83;font-size:13px;line-height:1.45}.hint{margin:5px 0 12px}.photo-grid{display:grid;gap:10px;margin:12px 0 16px}.photo-card{padding:11px;background:#f7f9fc}.photo-actions{margin-top:8px}.upload{display:grid;place-items:center;position:relative;text-align:center}.upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.photo-actions button{padding-inline:6px}.crop{display:block;max-width:100%;width:auto;height:auto;max-height:170px;margin:8px auto 0;border-radius:8px;background:#e7edf5}
details{margin-top:8px}summary{padding:11px 0;cursor:pointer;font-weight:650}details label{display:grid;gap:4px;margin:8px 0;font-size:13px}input[type=range]{width:100%;min-height:32px;accent-color:#126bbc}textarea{width:100%;min-height:76px;resize:none;border:1px solid #cdd8e7;border-radius:12px;padding:10px;margin:6px 0;color:inherit;background:white;font-size:16px}.count{display:block;text-align:right;margin-bottom:12px}
#preview{display:block;width:100%;height:auto;background:white;border:1px solid #e1e7ef;border-radius:8px;margin-bottom:12px}#status{min-height:0;margin:8px 0;font-size:13px}#status:empty{display:none}dialog{width:min(92%,400px);border:0;border-radius:16px;padding:18px;color:inherit}dialog::backdrop{background:#051b4899}@media(min-width:560px){.photo-grid{grid-template-columns:1fr 1fr}}

.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 10px;gap:7px}.photo-card{padding:8px;min-width:0}.photo-card h2 small{font-weight:500;font-size:11px}.photo-actions{grid-template-columns:1fr;gap:4px}.photo-actions .upload{padding-inline:5px}.photo-actions .remove{min-height:36px;padding:4px}.count{margin-bottom:7px}
.design-sheet{position:relative;margin-bottom:8px}.design-sheet #preview{margin:0;border:0}#touchArea{position:absolute;inset:0 0 auto;height:62.5%;touch-action:none;cursor:grab;z-index:1}#touchArea:active{cursor:grabbing}
@media(max-width:559px){body{padding:6px}section{padding:9px}.tabs{margin-bottom:7px}.tabs button{padding-inline:5px}.photo-card h2{font-size:13px}#config .upload{font-size:13px}}
@font-face{font-family:"Barlow Condensed";src:url("./fuentes/barlowcondensed.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Oswald";src:url("./fuentes/oswald.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Fira Sans Condensed";src:url("./fuentes/firasanscondensed.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Archivo";src:url("./fuentes/archivo.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Montserrat";src:url("./fuentes/montserrat.woff2") format("woff2");font-weight:800;font-display:swap}
.font-picks{display:flex;align-items:center;gap:4px;margin:0 0 8px;flex-wrap:wrap}.font-picks span{font-size:12px;margin-right:4px}.font-picks button{min-height:44px;min-width:44px;padding:4px;border-radius:8px}.font-picks [aria-pressed=true]{background:#051b48;color:white;border-color:#051b48}
</style>
</head>
<body><main>
<nav class="tabs" aria-label="Diseños"><button type="button" data-tab="config" class="active" aria-pressed="true">Configuración</button><button type="button" data-tab="preview" aria-pressed="false">Vista previa</button></nav>
<section id="config">

<div class="photo-grid" id="photos"></div>
<label for="headline"><strong>Titular</strong></label><textarea id="headline" rows="2" maxlength="220" placeholder="Escribe el titular de la noticia"></textarea><small class="count" id="count">0 / 220</small>
<button type="button" class="primary" id="view" style="width:100%">Ver vista previa</button>
</section>
<section id="previewPanel" hidden>
<div class="font-picks" role="group" aria-label="Tipografía del titular"><span>Tipografía</span><button type="button" data-font="0" aria-label="1. Barlow Condensed" title="Barlow Condensed" aria-pressed="true">1</button><button type="button" data-font="1" aria-label="2. Oswald" title="Oswald" aria-pressed="false">2</button><button type="button" data-font="2" aria-label="3. Fira Sans Condensed" title="Fira Sans Condensed" aria-pressed="false">3</button><button type="button" data-font="3" aria-label="4. Archivo" title="Archivo" aria-pressed="false">4</button><button type="button" data-font="4" aria-label="5. Montserrat" title="Montserrat" aria-pressed="false">5</button></div>
<div class="design-sheet"><div id="touchArea" aria-hidden="true" hidden></div><canvas id="preview" width="1200" height="1400" aria-label="Vista previa del diseño vertical"></canvas></div>
<div class="actions"><button type="button" class="primary" id="download">Descargar PNG</button><button type="button" id="newDesign">Nuevo diseño</button></div>
</section>
<p id="status" role="status"></p>
<dialog id="resetDialog" aria-labelledby="resetTitle"><h2 id="resetTitle">¿Empezar un nuevo diseño?</h2><p>Se quitarán las fotos y el titular actuales.</p><form method="dialog" class="actions"><button value="cancel">Cancelar</button><button class="primary" value="reset">Nuevo diseño</button></form></dialog>
</main>
<script src="./editor.js?v=18"></script>
</body></html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panel de Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5.0.0/index.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    font-family: 'Inter', sans-serif; 
    background: #1a1a2e; 
    color: white; 
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-user-select: none;
    user-select: none;
    touch-action: pan-y;
  }
  body { padding: 20px; }
  .container { 
    max-width: 600px; 
    margin: 0 auto; 
    background: #16213e; 
    border-radius: 20px; 
    padding: 25px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  h1 { font-size: 24px; margin-bottom: 10px; color: #ff3b3b; letter-spacing: 2px; text-align: center; }
  .status { display: block; text-align: center; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 1px; margin: 0 auto 20px; background: #ef4444; max-width: 200px; }
  .section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .section:last-of-type { border-bottom: none; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #94a3b8; margin-bottom: 12px; }
  .input { width: 100%; background: #0f172a; border: 2px solid #334155; color: white; padding: 12px 16px; border-radius: 10px; font-size: 15px; font-family: inherit; font-weight: 600; margin-bottom: 8px; -webkit-user-select: text; user-select: text; }
  .input:focus { outline: none; border-color: #ff3b3b; }
  .team-config-section { padding-bottom: 12px; }
  .team-config-fields { display: none; margin-top: 10px; }
  .team-config-fields.open { display: block; }
  .btn-team-toggle { background: #2563eb; width: 100%; }
  .btn-config { background: #10b981; width: 100%; margin-top: 4px; }

  .score-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    text-align: center;
  }
  .score-row:last-child { margin-bottom: 0; }
  .score-label {
    width: 100%;
    font-weight: 900;
    font-size: 18px;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .score-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
  }
  .score-btn {
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 14px;
    font-size: 30px;
    font-weight: 900;
    cursor: pointer;
    color: white;
    flex-shrink: 0;
  }
  .score-btn.minus { background: #ef4444; }
  .score-btn.plus { background: #10b981; }
  .score-value {
    width: 82px;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 46px;
    line-height: 1;
    background: #0f172a;
    border-radius: 14px;
    padding: 8px 0;
    flex-shrink: 0;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-family: inherit; font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; color: white; }
  .btn-start { background: #10b981; }
  .btn-pause { background: #f59e0b; }
  .btn-reset { background: #6b7280; }
  .btn-toggle { background: #10b981; width: 100%; margin-top: 8px; }
  .btn-clear { background: #dc2626; width: 100%; margin-top: 8px; }
  .btn-obs { background: #3b82f6; width: 100%; margin-top: 8px; }
  a.btn { display: block; text-decoration: none; text-align: center; }
  .timer-preview { text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 72px; line-height: 1; color: #ff3b3b; margin: 14px 0 18px; letter-spacing: 5px; }
  .info-box { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); border-radius: 10px; padding: 12px; margin-top: 15px; }
  .info-box p { font-size: 12px; color: #94a3b8; line-height: 1.5; }
  .info-box code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; color: #60a5fa; font-size: 11px; }
  .log-box { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-top: 12px; font-size: 10px; font-family: monospace; color: #94a3b8; max-height: 100px; overflow-y: auto; }
  .log-box .ok { color: #10b981; }
  .log-box .err { color: #ef4444; }
  .log-box .info { color: #60a5fa; }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .container { padding: 18px; border-radius: 15px; }
    h1 { font-size: 20px; }
    .timer-preview { font-size: 62px; }
    .score-label { font-size: 17px; }
    .score-btn { width: 54px; height: 54px; font-size: 28px; }
    .score-value { font-size: 42px; width: 78px; }
    .score-controls { gap: 10px; }
    .btn { font-size: 12px; padding: 12px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1> PANEL DE CONTROL</h1>
    <div class="status" id="status">INICIANDO...</div>

    <div class="section team-config-section">
      <button class="btn btn-team-toggle" id="btnTeamToggle" onclick="toggleTeamConfig()">✏️ ASIGNAR NOMBRES DE EQUIPOS</button>
      <div class="team-config-fields" id="teamConfigFields">
        <input type="text" class="input" id="inputHome" value="EQUIPO LOCAL" placeholder="Equipo local">
        <input type="text" class="input" id="inputAway" value="EQUIPO VISITANTE" placeholder="Equipo visitante">
        <button class="btn btn-config" id="btnSaveTeams" onclick="saveTeamConfiguration()">💾 GUARDAR CONFIGURACIÓN</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">⚽ Marcador</div>
      <div class="score-row">
        <div class="score-label" id="labelHome">EQUIPO LOCAL</div>
        <div class="score-controls">
          <button class="score-btn minus" onclick="changeScore('home', -1)">−</button>
          <div class="score-value" id="displayScoreHome">0</div>
          <button class="score-btn plus" onclick="changeScore('home', 1)">+</button>
        </div>
      </div>
      <div class="score-row">
        <div class="score-label" id="labelAway">EQUIPO VISITANTE</div>
        <div class="score-controls">
          <button class="score-btn minus" onclick="changeScore('away', -1)">−</button>
          <div class="score-value" id="displayScoreAway">0</div>
          <button class="score-btn plus" onclick="changeScore('away', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">⏱️ Cronómetro</div>
      <div class="timer-preview" id="timerPreview">00:00</div>
      <div class="btn-row">
        <button class="btn btn-start" onclick="startTimer()">▶ Iniciar</button>
        <button class="btn btn-pause" onclick="pauseTimer()">❚ Pausar</button>
        <button class="btn btn-reset" onclick="resetTimer()">↺ Reset</button>
      </div>
      <input type="number" class="input" id="inputTimer" value="0" min="0" style="margin-top:12px;">
    </div>

    <!-- 👁 NUEVO BOTÓN: MOSTRAR / OCULTAR MARCADOR EN EL OVERLAY -->
    <button class="btn btn-toggle" id="btnVisibility" onclick="toggleVisibility()">👁 MARCADOR VISIBLE</button>

    <button class="btn btn-clear" onclick="clearAll()"> LIMPIAR TODO</button>
    
    <a href="obs.html" target="_blank" class="btn btn-obs">📺 ABRIR OVERLAY PARA OBS</a>

    <div class="log-box" id="logBox"></div>

    <div class="info-box">
      <p><strong>📋 Instrucciones:</strong></p>
      <p>1. Panel: <code>index.html</code><br>
         2. Overlay OBS: <code>obs.html</code><br>
         3. URL OBS: <code>https://tu-sitio.netlify.app/obs.html</code><br>
         4. Dimensiones: <code>1080 x 608</code></p>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://xwhtvfcsbvwyymenqmva.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3aHR2ZmNzYnZ3eXltZW5xbXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjc1MjUsImV4cCI6MjEwMjk0MzUyNX0.NDqptVkHHmTasYeO6tN91GIh5_cNGAaYyBIfRps_fR4';
  
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let state = { 
    nameHome: 'EQUIPO LOCAL', 
    nameAway: 'EQUIPO VISITANTE', 
    scoreHome: 0, 
    scoreAway: 0, 
    timerSeconds: 0, 
    isRunning: false, 
    sessionStart: 0,
    visible: true
  };
  let timerInterval = null;
  let teamInputsDirty = false;

  const LOCAL_CACHE_KEY = 'cdn_overlay_state_v2';

  function saveLocalCache() {
    try {
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('No se pudo guardar caché local:', e);
    }
  }

  function loadLocalCache() {
    try {
      const cached = localStorage.getItem(LOCAL_CACHE_KEY);
      return cached ? JSON.parse(cached) : null;
    } catch (e) {
      console.warn('No se pudo leer caché local:', e);
      return null;
    }
  }

  function getElapsedSeconds() {
    if (state.isRunning && Number(state.sessionStart) > 0) {
      return Math.max(0, Math.floor((Date.now() - Number(state.sessionStart)) / 1000));
    }
    return Math.max(0, Number(state.timerSeconds) || 0);
  }

  function renderTimer() {
    document.getElementById('timerPreview').textContent = formatTime(getElapsedSeconds());
  }

  function startLocalTimer() {
    if (timerInterval) clearInterval(timerInterval);
    renderTimer();
    timerInterval = setInterval(renderTimer, 1000);
  }

  function stopLocalTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    renderTimer();
  }

  function log(msg, type = 'info') {
    const box = document.getElementById('logBox');
    const time = new Date().toLocaleTimeString();
    box.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function updateUI() {
    // No sobrescribe los campos mientras el usuario está escribiendo en el teléfono.
    if (!teamInputsDirty) {
      document.getElementById('inputHome').value = state.nameHome;
      document.getElementById('inputAway').value = state.nameAway;
    }
    document.getElementById('labelHome').textContent = state.nameHome;
    document.getElementById('labelAway').textContent = state.nameAway;
    document.getElementById('displayScoreHome').textContent = state.scoreHome;
    document.getElementById('displayScoreAway').textContent = state.scoreAway;
    renderTimer();
    
    // Actualiza el botón de mostrar/ocultar
    const btnVis = document.getElementById('btnVisibility');
    if (state.visible) {
      btnVis.textContent = '👁 MARCADOR VISIBLE';
      btnVis.style.background = '#10b981';
    } else {
      btnVis.textContent = '🚫 MARCADOR OCULTO';
      btnVis.style.background = '#6b7280';
    }
  }

  function toggleVisibility() {
    state.visible = !state.visible;
    updateUI();
    saveToSupabase();
    log(state.visible ? '👁 Marcador visible en overlay' : '🚫 Marcador oculto en overlay', 'info');
  }

  function toggleTeamConfig(forceOpen = null) {
    const fields = document.getElementById('teamConfigFields');
    const button = document.getElementById('btnTeamToggle');

    const shouldOpen =
      forceOpen === null
        ? !fields.classList.contains('open')
        : forceOpen;

    fields.classList.toggle('open', shouldOpen);
    button.textContent = shouldOpen
      ? '✖ CERRAR ASIGNACIÓN DE NOMBRES'
      : '✏️ ASIGNAR NOMBRES DE EQUIPOS';

    if (shouldOpen) {
      document.getElementById('inputHome').focus();
    }
  }

  function saveTeamConfiguration() {
    const homeInput = document.getElementById('inputHome');
    const awayInput = document.getElementById('inputAway');

    state.nameHome = (homeInput.value.trim() || 'EQUIPO LOCAL').toUpperCase();
    state.nameAway = (awayInput.value.trim() || 'EQUIPO VISITANTE').toUpperCase();
    teamInputsDirty = false;

    homeInput.blur();
    awayInput.blur();
    updateUI();
    toggleTeamConfig(false);
    saveToSupabase();
    log('✅ Configuración de equipos guardada', 'ok');
  }

  function updateStatus(text, color) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.style.background = color;
  }

  async function saveToSupabase() {
    // Guardado local inmediato para que el cronómetro siga siendo recuperable
    // aunque la conexión falle temporalmente.
    saveLocalCache();
    log('Guardando...', 'info');
    try {
      const { error } = await sbClient.from('overlay_state').upsert({
        id: 1, 
        name_home: state.nameHome, 
        name_away: state.nameAway,
        score_home: state.scoreHome, 
        score_away: state.scoreAway,
        timer_seconds: state.timerSeconds, 
        is_running: state.isRunning, 
        session_start: state.sessionStart,
        visible: state.visible
      });
      if (error) log('❌ Error: ' + error.message, 'err');
      else log('✅ Guardado OK', 'ok');
    } catch (e) { log('⚠️ Excepción: ' + e.message, 'err'); }
  }

  function startTimer() {
    if (state.isRunning) return;

    // Conserva el tiempo acumulado y fija un origen absoluto.
    state.sessionStart = Date.now() - (Number(state.timerSeconds) || 0) * 1000;
    state.isRunning = true;

    startLocalTimer();
    saveToSupabase();
    updateStatus('▶ CORRIENDO', '#10b981');
  }

  function pauseTimer() {
    if (!state.isRunning) return;

    // Congela exactamente el tiempo alcanzado antes de pausar.
    state.timerSeconds = getElapsedSeconds();
    state.isRunning = false;
    state.sessionStart = 0;

    stopLocalTimer();
    updateUI();
    saveToSupabase();
    updateStatus('⏸ PAUSADO', '#f59e0b');
  }

  function resetTimer() {
    state.isRunning = false;
    stopLocalTimer();

    const mins = parseInt(document.getElementById('inputTimer').value) || 0;
    state.timerSeconds = mins * 60;
    state.sessionStart = 0;

    updateUI();
    saveToSupabase();
    updateStatus('🔄 RESET', '#6b7280');
  }

  function changeScore(team, amount) {
    if (team === 'home') {
      state.scoreHome = Math.max(0, state.scoreHome + amount);
    } else {
      state.scoreAway = Math.max(0, state.scoreAway + amount);
    }
    updateUI();
    saveToSupabase();
  }

  async function init() {
    log('Conectando...', 'info');

    try {
      const { data, error } = await sbClient
        .from('overlay_state')
        .select('*')
        .eq('id', 1)
        .single();

      if (error) throw error;

      state = {
        nameHome: data.name_home ?? 'EQUIPO LOCAL',
        nameAway: data.name_away ?? 'EQUIPO VISITANTE',
        scoreHome: data.score_home ?? 0,
        scoreAway: data.score_away ?? 0,
        timerSeconds: data.timer_seconds ?? 0,
        isRunning: data.is_running ?? false,
        sessionStart: Number(data.session_start) || 0,
        visible: data.visible !== false
      };

      saveLocalCache();
      updateUI();

      if (state.isRunning && state.sessionStart > 0) {
        // No se recalcula sessionStart: se respeta el origen guardado.
        startLocalTimer();
        updateStatus('▶ CORRIENDO', '#10b981');
      } else {
        stopLocalTimer();
        updateStatus('✅ CONECTADO', '#10b981');
      }

      log('✅ Conectado', 'ok');

    } catch (e) {
      const cached = loadLocalCache();

      if (cached) {
        state = { ...state, ...cached, sessionStart: Number(cached.sessionStart) || 0 };
        updateUI();

        if (state.isRunning && state.sessionStart > 0) startLocalTimer();
        else stopLocalTimer();

        updateStatus('📴 SIN CONEXIÓN · USANDO CACHÉ', '#f59e0b');
        log('⚠️ Sin conexión. Cronómetro recuperado desde este dispositivo.', 'info');
      } else {
        updateStatus('⚠️ ERROR DE CONEXIÓN', '#ef4444');
        log('❌ Error: ' + (e.message || e), 'err');
      }
    }
  }

  sbClient.channel('overlay_changes')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'overlay_state', filter: 'id=eq.1' },
      (payload) => {
        const d = payload.new;
        if (!d) return;

        state.nameHome = d.name_home ?? state.nameHome;
        state.nameAway = d.name_away ?? state.nameAway;
        state.scoreHome = d.score_home ?? 0;
        state.scoreAway = d.score_away ?? 0;
        state.timerSeconds = d.timer_seconds ?? 0;
        state.isRunning = d.is_running ?? false;
        state.sessionStart = Number(d.session_start) || 0;
        state.visible = d.visible !== false;

        saveLocalCache();

        if (state.isRunning && state.sessionStart > 0) {
          startLocalTimer();
          updateStatus('▶ CORRIENDO', '#10b981');
        } else {
          stopLocalTimer();
          updateStatus('⏸ PAUSADO', '#f59e0b');
        }

        updateUI();
      }
    )
    .subscribe();

  const inputHome = document.getElementById('inputHome');
  const inputAway = document.getElementById('inputAway');

  // Escribir ya no guarda en Supabase letra por letra. Evita parpadeos y saltos del cursor en móvil.
  [inputHome, inputAway].forEach((input) => {
    input.addEventListener('input', () => {
      teamInputsDirty = true;
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveTeamConfiguration();
      }
    });
  });
  
  function clearAll() {
    if(confirm('¿Borrar todo?')) {
      state = { nameHome: 'EQUIPO LOCAL', nameAway: 'EQUIPO VISITANTE', scoreHome: 0, scoreAway: 0, timerSeconds: 0, isRunning: false, sessionStart: 0, visible: true };
      stopLocalTimer();
      teamInputsDirty = false;
      updateUI();
      saveToSupabase();
      updateStatus('🔄 LIMPIO', '#6b7280');
    }
  }

  window.addEventListener('offline', () => {
    updateStatus('📴 SIN CONEXIÓN · CRONÓMETRO LOCAL', '#f59e0b');
    log('⚠️ Internet desconectado. El cronómetro continúa localmente.', 'info');
  });

  window.addEventListener('online', () => {
    updateStatus(state.isRunning ? '▶ CORRIENDO' : '✅ CONECTADO', '#10b981');
    log('✅ Internet restablecido. Sincronizando...', 'ok');
    saveToSupabase();
  });

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panel Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5.0.0/index.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    font-family: 'Inter', sans-serif; 
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
    color: white; 
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-user-select: none;
    user-select: none;
    touch-action: pan-y;
  }
  body { padding: 10px; }
  
  .container { 
    max-width: 600px; 
    margin: 0 auto; 
    background: rgba(22, 33, 62, 0.9); 
    border-radius: 15px; 
    padding: 15px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  
  /* HEADER COMPACTO */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }
  
  h1 { 
    font-size: 16px; 
    color: #ff3b3b; 
    letter-spacing: 1px; 
    font-weight: 900;
    text-transform: uppercase;
    flex: 1;
  }
  
  .status { 
    font-size: 10px; 
    font-weight: 700; 
    padding: 4px 10px; 
    border-radius: 12px;
    white-space: nowrap;
    background: #ef4444;
  }

  /* BOTÓN CONFIGURAR - COMPACTO */
  .toggle-section-btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* SECCIÓN EQUIPOS - COMPACTA */
  .teams-section {
    display: none;
    margin-bottom: 12px;
    padding: 12px;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 10px;
    border: 2px solid rgba(59, 130, 246, 0.3);
  }
  
  .teams-section.visible { display: block; }
  
  .section-title { 
    font-size: 10px; 
    font-weight: 700; 
    text-transform: uppercase; 
    color: #94a3b8; 
    margin-bottom: 8px;
    text-align: center;
  }
  
  .input { 
    width: 100%; 
    background: #0f172a; 
    border: 2px solid #334155; 
    color: white; 
    padding: 8px 12px; 
    border-radius: 6px; 
    font-size: 13px; 
    font-weight: 600; 
    margin-bottom: 8px;
    -webkit-user-select: text; 
    user-select: text;
  }

  /* MARCADOR - RESPONSIVE */
  .scoreboard {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    border: 2px solid rgba(255, 255, 255, 0.1);
  }
  
  .score-row { 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    margin-bottom: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
  }
  
  .score-row:last-child { margin-bottom: 0; }
  
  .score-label { 
    flex: 1; 
    font-weight: 700; 
    font-size: 11px;
    text-align: center;
    color: #e2e8f0;
    text-transform: uppercase;
  }
  
  .score-btn { 
    width: 45px; 
    height: 45px; 
    border: none; 
    border-radius: 8px; 
    font-size: 24px; 
    font-weight: 900; 
    cursor: pointer; 
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .score-btn.minus { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
  .score-btn.plus { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
  
  .score-value { 
    width: 60px; 
    text-align: center; 
    font-family: 'Bebas Neue', sans-serif; 
    font-size: 36px; 
    background: linear-gradient(135deg, #ff3b3b 0%, #dc2626 100%);
    border-radius: 8px; 
    padding: 5px 0; 
    color: white;
  }

  /* CRONÓMETRO - RESPONSIVE */
  .timer-section {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    border: 2px solid rgba(255, 59, 59, 0.3);
  }
  
  .timer-preview { 
    text-align: center; 
    font-family: 'Bebas Neue', sans-serif; 
    font-size: 56px;
    color: #ff3b3b; 
    margin: 10px 0 15px; 
    letter-spacing: 4px;
    font-weight: 900;
  }
  
  .btn-row { 
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  
  .btn { 
    padding: 12px; 
    border: none; 
    border-radius: 8px; 
    font-family: inherit; 
    font-weight: 800; 
    font-size: 11px; 
    text-transform: uppercase; 
    cursor: pointer; 
    color: white;
  }
  
  .btn-start { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
  .btn-pause { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
  .btn-reset { background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); }
  
  .input-timer {
    width: 100%;
    background: #0f172a;
    border: 2px solid #334155;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
  }

  /* BOTONES PRINCIPALES */
  .main-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  
  .btn-toggle { 
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    color: white;
    text-transform: uppercase;
  }
  
  .btn-toggle.hidden-mode {
    background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
  }
  
  .btn-clear { 
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    color: white;
    text-transform: uppercase;
  }
  
  .btn-obs { 
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    color: white;
    text-transform: uppercase;
    text-decoration: none;
    text-align: center;
    display: block;
  }

  .log-box { 
    background: #0f172a; 
    border: 2px solid #334155; 
    border-radius: 8px; 
    padding: 8px; 
    margin-top: 12px; 
    font-size: 9px; 
    font-family: 'Courier New', monospace; 
    color: #94a3b8; 
    max-height: 80px; 
    overflow-y: auto;
  }
  
  .log-box .ok { color: #10b981; }
  .log-box .err { color: #ef4444; }
  .log-box .info { color: #60a5fa; }

  /* MEDIA QUERIES PARA MÓVIL */
  @media (max-width: 480px) {
    body { padding: 8px; }
    .container { padding: 12px; border-radius: 12px; }
    
    h1 { font-size: 14px; }
    .status { font-size: 9px; padding: 3px 8px; }
    
    .score-btn { width: 40px; height: 40px; font-size: 20px; }
    .score-value { width: 50px; font-size: 32px; }
    .score-label { font-size: 10px; }
    
    .timer-preview { font-size: 48px; }
    .btn { font-size: 10px; padding: 10px; }
    
    .scoreboard, .timer-section { padding: 10px; }
  }
  
  @media (max-width: 360px) {
    .score-btn { width: 36px; height: 36px; font-size: 18px; }
    .score-value { width: 45px; font-size: 28px; }
    .timer-preview { font-size: 42px; }
    .btn { font-size: 9px; padding: 8px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>PANEL CONTROL</h1>
      <div class="status" id="status">INICIANDO</div>
    </div>

    <button class="toggle-section-btn" onclick="toggleTeamsSection()">
      <span id="teamsToggleIcon">️</span>
      <span id="teamsToggleText">CONFIGURAR</span>
    </button>

    <div class="teams-section" id="teamsSection">
      <div class="section-title">NOMBRES DE EQUIPOS</div>
      <input type="text" class="input" id="inputHome" placeholder="LOCAL" value="LOCAL">
      <input type="text" class="input" id="inputAway" placeholder="VISITANTE" value="VISITANTE">
    </div>

    <div class="scoreboard">
      <div class="section-title">MARCADOR</div>
      
      <div class="score-row">
        <div class="score-label" id="labelHome">LOCAL</div>
        <button class="score-btn minus" onclick="changeScore('home', -1)">−</button>
        <div class="score-value" id="displayScoreHome">0</div>
        <button class="score-btn plus" onclick="changeScore('home', 1)">+</button>
      </div>
      
      <div class="score-row">
        <div class="score-label" id="labelAway">VISITANTE</div>
        <button class="score-btn minus" onclick="changeScore('away', -1)">−</button>
        <div class="score-value" id="displayScoreAway">0</div>
        <button class="score-btn plus" onclick="changeScore('away', 1)">+</button>
      </div>
    </div>

    <div class="timer-section">
      <div class="section-title">CRONÓMETRO</div>
      <div class="timer-preview" id="timerPreview">00:00</div>
      
      <div class="btn-row">
        <button class="btn btn-start" onclick="startTimer()">INICIAR</button>
        <button class="btn btn-pause" onclick="pauseTimer()">PAUSAR</button>
        <button class="btn btn-reset" onclick="resetTimer()">RESET</button>
      </div>
      
      <input type="number" class="input-timer" id="inputTimer" value="0" min="0" placeholder="Minutos">
    </div>

    <div class="main-buttons">
      <button class="btn-toggle" id="btnVisibility" onclick="toggleVisibility()">👁 MARCADOR VISIBLE</button>
      <button class="btn-clear" onclick="clearAll()">LIMPIAR TODO</button>
      <a href="obs.html" target="_blank" class="btn-obs"> ABRIR OBS</a>
    </div>

    <div class="log-box" id="logBox"></div>
  </div>

<script>
  const SUPABASE_URL = 'https://xwhtvfcsbvwyymenqmva.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3aHR2ZmNzYnZ3eXltZW5xbXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjc1MjUsImV4cCI6MjEwMjk0MzUyNX0.NDqptVkHHmTasYeO6tN91GIh5_cNGAaYyBIfRps_fR4';
  
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let state = { 
    nameHome: 'LOCAL', 
    nameAway: 'VISITANTE', 
    scoreHome: 0, 
    scoreAway: 0, 
    timerSeconds: 0, 
    isRunning: false, 
    sessionStart: 0,
    visible: true
  };
  let timerInterval = null;

  function toggleTeamsSection() {
    const section = document.getElementById('teamsSection');
    const icon = document.getElementById('teamsToggleIcon');
    const text = document.getElementById('teamsToggleText');
    
    if (section.classList.contains('visible')) {
      section.classList.remove('visible');
      icon.textContent = '⚙️';
      text.textContent = 'CONFIGURAR';
    } else {
      section.classList.add('visible');
      icon.textContent = '✖️';
      text.textContent = 'CERRAR';
    }
  }

  function log(msg, type = 'info') {
    const box = document.getElementById('logBox');
    const time = new Date().toLocaleTimeString();
    box.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function updateUI() {
    document.getElementById('inputHome').value = state.nameHome;
    document.getElementById('inputAway').value = state.nameAway;
    document.getElementById('labelHome').textContent = state.nameHome;
    document.getElementById('labelAway').textContent = state.nameAway;
    document.getElementById('displayScoreHome').textContent = state.scoreHome;
    document.getElementById('displayScoreAway').textContent = state.scoreAway;
    document.getElementById('timerPreview').textContent = formatTime(state.timerSeconds);
    
    const btnVis = document.getElementById('btnVisibility');
    if (state.visible) {
      btnVis.textContent = '👁 MARCADOR VISIBLE';
      btnVis.classList.remove('hidden-mode');
    } else {
      btnVis.textContent = '🚫 MARCADOR OCULTO';
      btnVis.classList.add('hidden-mode');
    }
  }

  function toggleVisibility() {
    state.visible = !state.visible;
    updateUI();
    saveToSupabase();
  }

  function updateStatus(text, color) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.style.background = color;
  }

  async function saveToSupabase() {
    try {
      const { error } = await sbClient.from('overlay_state').upsert({
        id: 1, 
        name_home: state.nameHome, 
        name_away: state.nameAway,
        score_home: state.scoreHome, 
        score_away: state.scoreAway,
        timer_seconds: state.timerSeconds, 
        is_running: state.isRunning, 
        session_start: state.sessionStart,
        visible: state.visible
      });
      if (error) log('Error: ' + error.message, 'err');
    } catch (e) { log('Excepción: ' + e.message, 'err'); }
  }

  function startTimer() {
    if (state.isRunning) return;
    state.isRunning = true;
    state.sessionStart = Date.now() - (state.timerSeconds * 1000);
    
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      state.timerSeconds = Math.floor((Date.now() - state.sessionStart) / 1000);
      document.getElementById('timerPreview').textContent = formatTime(state.timerSeconds);
    }, 1000);
    
    saveToSupabase();
    updateStatus('CORRIENDO', '#10b981');
  }

  function pauseTimer() {
    state.isRunning = false;
    if (timerInterval) clearInterval(timerInterval);
    saveToSupabase();
    updateStatus('PAUSADO', '#f59e0b');
  }

  function resetTimer() {
    state.isRunning = false;
    if (timerInterval) clearInterval(timerInterval);
    const mins = parseInt(document.getElementById('inputTimer').value) || 0;
    state.timerSeconds = mins * 60;
    state.sessionStart = 0;
    updateUI();
    saveToSupabase();
    updateStatus('RESET', '#6b7280');
  }

  function changeScore(team, amount) {
    if (team === 'home') {
      state.scoreHome = Math.max(0, state.scoreHome + amount);
    } else {
      state.scoreAway = Math.max(0, state.scoreAway + amount);
    }
    updateUI();
    saveToSupabase();
  }

  async function init() {
    try {
      const { data, error } = await sbClient.from('overlay_state').select('*').eq('id', 1).single();
      if (error) { 
        updateStatus('ERROR', '#ef4444'); 
        return; 
      }
      
      state = { 
        nameHome: data.name_home || 'LOCAL', 
        nameAway: data.name_away || 'VISITANTE', 
        scoreHome: data.score_home || 0, 
        scoreAway: data.score_away || 0, 
        timerSeconds: data.timer_seconds || 0, 
        isRunning: data.is_running || false, 
        sessionStart: data.session_start || 0,
        visible: data.visible !== false
      };
      updateUI();
      
      if (state.isRunning) {
        state.sessionStart = Date.now() - (state.timerSeconds * 1000);
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          state.timerSeconds = Math.floor((Date.now() - state.sessionStart) / 1000);
          document.getElementById('timerPreview').textContent = formatTime(state.timerSeconds);
        }, 1000);
        updateStatus('CORRIENDO', '#10b981');
      } else {
        updateStatus('CONECTADO', '#10b981');
      }
    } catch (e) { 
      updateStatus('ERROR', '#ef4444'); 
    }
  }

  sbClient.channel('overlay_changes')
    .on('postgres_changes', 
      { event: '*', schema: 'public', table: 'overlay_state', filter: 'id=eq.1' },
      (payload) => {
        const d = payload.new;
        state.nameHome = d.name_home;
        state.nameAway = d.name_away;
        state.scoreHome = d.score_home;
        state.scoreAway = d.score_away;
        state.timerSeconds = d.timer_seconds;
        state.isRunning = d.is_running;
        state.sessionStart = d.session_start;
        state.visible = d.visible !== false;
        
        if (state.isRunning && !timerInterval) {
          state.sessionStart = Date.now() - (state.timerSeconds * 1000);
          timerInterval = setInterval(() => {
            state.timerSeconds = Math.floor((Date.now() - state.sessionStart) / 1000);
            document.getElementById('timerPreview').textContent = formatTime(state.timerSeconds);
          }, 1000);
          updateStatus('CORRIENDO', '#10b981');
        }
        updateUI();
      }
    )
    .subscribe();

  document.getElementById('inputHome').addEventListener('input', (e) => { state.nameHome = e.target.value.toUpperCase(); updateUI(); saveToSupabase(); });
  document.getElementById('inputAway').addEventListener('input', (e) => { state.nameAway = e.target.value.toUpperCase(); updateUI(); saveToSupabase(); });
  
  function clearAll() {
    if(confirm('¿Borrar todo?')) {
      state = { nameHome: 'LOCAL', nameAway: 'VISITANTE', scoreHome: 0, scoreAway: 0, timerSeconds: 0, isRunning: false, sessionStart: 0, visible: true };
      if (timerInterval) clearInterval(timerInterval);
      updateUI();
      saveToSupabase();
      updateStatus('LIMPIO', '#6b7280');
    }
  }

  init();
</script>
</body>
</html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#051b48"><title>CDN Studio</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><link rel="stylesheet" href="assets/css/app.css?v=8"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><link rel="stylesheet" href="assets/css/wizard.css?v=8"><script src="assets/js/interaction-guard.js?v=8"></script></head><body data-screen="auth">
<section id="auth" class="auth-card"><h1>CDN Studio</h1><form id="authForm"><label id="nameLabel" hidden>Tu nombre<input id="displayName" autocomplete="name" maxlength="80"></label><label>Usuario o teléfono<input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="60" required></label><label id="passwordLabel">Contraseña<input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="128" required></label><button id="authSubmit" class="primary" type="submit">Entrar</button></form><div class="auth-links"><button id="switchAuth">Crear cuenta</button></div><p class="muted" style="font-size:12px">Contraseña de al menos 6 caracteres. No hay recuperación por correo ni SMS; guarda bien tu usuario y contraseña.</p><p id="authMessage" role="status" aria-live="polite"></p></section>
<div id="workspace" hidden><header class="shell-header"><div><h1 id="pageTitle">Inicio</h1></div><button id="accountShortcut" aria-label="Abrir mi cuenta" class="avatar"><img src="assets/images/cdn-logo.png" alt="CDN Escuintla"></button></header><main id="content">
<section id="home" class="page"><h2 id="greeting">Tu espacio</h2><div class="tool-grid"><button data-open="transmision"><span>◉</span><strong>Transmisión</strong><small>Marcador y anunciantes</small></button><button data-open="disenos"><span>▧</span><strong>Diseños</strong><small>Foto, titular y PNG</small></button><button data-open="cotizaciones"><span>▤</span><strong>Cotizaciones</strong><small>Precios, imagen y PDF</small></button></div><p id="homeMessage" role="status"></p></section>
<section id="modulePage" class="page module-page" hidden><span id="syncStatus" class="sr-only" role="status"></span><details id="quoteSaved" class="quote-history" hidden><summary>Cotizaciones guardadas</summary><div id="recentList" class="saved-list"></div></details><div id="frames"></div></section>
<section id="account" class="page" hidden><h2>Mi cuenta</h2><form id="profileForm"><label>Tu nombre<input id="profileName" maxlength="80" required></label><button class="primary" type="submit">Guardar perfil</button></form><p id="profileMessage" role="status"></p><p id="accountEmail" class="muted"></p><button id="changePassword" type="button">Cambiar contraseña</button><form id="passwordChangeForm" hidden><label>Nueva contraseña<input id="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label><button type="submit">Guardar contraseña</button></form><button id="logout" class="danger">Cerrar sesión</button></section>
</main><nav class="main-nav" aria-label="Herramientas"><button data-route="home" class="active"><span>⌂</span>Inicio</button><button data-route="transmision"><span>◉</span>Transmisión</button><button data-route="disenos"><span>▧</span>Diseños</button><button data-route="cotizaciones"><span>▤</span>Cotizar</button><button data-route="account"><span>♙</span>Mi cuenta</button></nav></div>
<script src="assets/js/identity.js?v=3"></script><script src="assets/js/document-viewer.js?v=8"></script><script src="assets/js/app.js?v=8"></script></body></html>

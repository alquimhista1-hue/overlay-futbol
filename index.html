<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#051b48"><title>CDN Studio</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><link rel="stylesheet" href="assets/css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script></head><body>
<section id="auth" class="auth-card"><p class="eyebrow">TU ESPACIO DE TRABAJO</p><h1>CDN Studio</h1><p>Transmisiones, diseños y cotizaciones en un solo lugar.</p><button id="google" class="primary">Continuar con Google</button><div class="divider">o usa tu correo</div><form id="authForm"><label id="nameLabel" hidden>Tu nombre<input id="displayName" autocomplete="name" maxlength="80"></label><label>Correo<input id="email" type="email" autocomplete="username" required></label><label id="passwordLabel">Contraseña<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button id="authSubmit" class="primary" type="submit">Entrar</button></form><div class="auth-links"><button id="switchAuth">Crear cuenta</button><button id="forgot">Olvidé mi contraseña</button></div><p id="authMessage" role="status" aria-live="polite"></p></section>
<div id="workspace" hidden><header class="shell-header"><div><p class="eyebrow">CDN STUDIO</p><h1 id="pageTitle">Inicio</h1></div><button id="accountShortcut" aria-label="Abrir mi cuenta" class="avatar">●</button></header><main id="content">
<section id="home" class="page"><h2 id="greeting">Tu espacio</h2><p class="muted">¿Qué vas a crear hoy?</p><div class="tool-grid"><button data-open="transmision"><span>◉</span><strong>Transmisión</strong><small>Marcador y anunciantes</small></button><button data-open="disenos"><span>▧</span><strong>Diseños</strong><small>Foto, titular y PNG</small></button><button data-open="cotizaciones"><span>▤</span><strong>Cotizaciones</strong><small>Precios, imagen y PDF</small></button></div><h2>Trabajos guardados</h2><div id="recentList" class="saved-list"></div></section>
<section id="modulePage" class="page module-page" hidden><div class="module-toolbar"><button id="newDocument">＋ Nuevo</button><button id="showSaved">Guardados</button><span id="syncStatus" role="status"></span></div><div id="savedPicker" class="saved-list" hidden></div><div id="frames"></div></section>
<section id="account" class="page" hidden><h2>Mi cuenta</h2><form id="profileForm"><label>Tu nombre<input id="profileName" maxlength="80" required></label><label>Nombre del negocio<input id="businessName" maxlength="120"></label><label>Teléfono<input id="businessPhone" maxlength="40" type="tel"></label><label>Dirección<textarea id="businessAddress" maxlength="500"></textarea></label><label>Logo del negocio<input id="businessLogo" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="logoPreview" alt="Logo del negocio" hidden><button class="primary" type="submit">Guardar perfil</button></form><p id="profileMessage" role="status"></p><p id="accountEmail" class="muted"></p><button id="changePassword">Cambiar contraseña por correo</button><button id="logout" class="danger">Cerrar sesión</button></section>
</main><nav class="main-nav" aria-label="Herramientas"><button data-route="home" class="active"><span>⌂</span>Inicio</button><button data-route="transmision"><span>◉</span>Transmisión</button><button data-route="disenos"><span>▧</span>Diseños</button><button data-route="cotizaciones"><span>▤</span>Cotizar</button><button data-route="account"><span>♙</span>Mi cuenta</button></nav></div>
<script src="assets/js/app.js"></script></body></html>
